<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>USDC from Polygon to Stellar: Circle CCTP, no added fees</title>
  <meta name="description" content="USDC from Polygon to Stellar through Circle's CCTP: burn on Polygon, mint on Stellar 1:1, no added fees. Your wallets sign, nothing is held.">
  <link rel="canonical" href="https://usdc.eww.monster/">
  <link rel="icon" href="/brand/usdc.svg" type="image/svg+xml">
  <meta name="theme-color" content="#f4f6f9">
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="usdc.eww.monster">
  <meta property="og:url" content="https://usdc.eww.monster/">
  <meta property="og:title" content="USDC from Polygon to Stellar">
  <meta property="og:description" content="Burn on Polygon, mint on Stellar 1:1. No added fees. Your wallets sign, nothing is held.">
  <meta property="og:image" content="https://usdc.eww.monster/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="USDC, Polygon to Stellar">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="ru_RU">
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="USDC from Polygon to Stellar">
  <meta name="twitter:description" content="Burn on Polygon, mint on Stellar 1:1. No added fees. Your wallets sign, nothing is held.">
  <meta name="twitter:image" content="https://usdc.eww.monster/og.png">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body data-dir="forward">
  <header class="top">
    <h1 class="fwd" data-i18n="title">USDC from Polygon to Stellar</h1>
    <h1 class="rev" data-i18n="titleReverse">USDC from Stellar to Polygon</h1>
    <select id="lang" class="lang" aria-label="Language"></select>
  </header>
  <p class="route">
    <span class="route-node"><img src="/brand/usdc.svg" width="20" height="20" alt="">USDC</span>
    <span class="route-sep" aria-hidden="true"></span>
    <!-- the current route, from and to; the button between them swaps the networks.
         One label per network, slid between the two slots: the heading already says the direction in words -->
    <span class="route-pick">
      <span class="route-chip net-polygon" aria-hidden="true"><img src="/brand/polygon.svg" width="22" height="20" alt="">Polygon</span>
      <button type="button" class="route-swap" id="routeSwap" data-i18n-title="route.swap" data-i18n-aria="route.swap">
        <!-- at rest an arrow, so the line reads "from → to"; under the cursor or keyboard focus it becomes swap -->
        <svg class="icon-dir" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        <svg class="icon-swap" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10h14l-4-4"/><path d="M17 14H3l4 4"/></svg>
      </button>
      <span class="route-chip net-stellar" aria-hidden="true"><img src="/brand/stellar.svg" width="20" height="20" alt="">Stellar</span>
    </span>
  </p>
  <p class="lede fwd" data-i18n-html="lede"></p>
  <p class="lede rev" data-i18n-html="ledeReverse"></p>
  <details class="needs">
    <summary data-i18n="needs.title"></summary>
    <ul class="fwd">
      <li data-i18n-html="needs.usdc"></li>
      <li data-i18n-html="needs.trustline"></li>
      <li data-i18n-html="needs.xlm"></li>
    </ul>
    <ul class="rev">
      <li data-i18n-html="needsR.usdc"></li>
      <li data-i18n-html="needsR.evm"></li>
      <li data-i18n-html="needsR.pol"></li>
    </ul>
  </details>

  <!-- Polygon → Stellar: steps 1–3 -->
  <section class="step fwd" id="step1" data-state="active">
    <h2><span class="num">1</span> <span data-i18n="step1.title"></span></h2>
    <div class="field">
      <label for="evm" data-i18n="step1.from"></label>
      <div class="row">
        <input id="evm" readonly placeholder="0x…" autocomplete="off">
        <span class="actions"><button type="button" id="connectEvm"><img class="btn-icon" src="/brand/metamask.svg" alt=""><span data-i18n="step1.connectMetaMask"></span></button></span>
      </div>
    </div>
    <div class="field">
      <label for="recipient" data-i18n="step1.to"></label>
      <div class="row">
        <input id="recipient" readonly placeholder="G…" autocomplete="off" spellcheck="false">
        <span class="actions">
          <button type="button" data-connect="recipient" data-wallet="albedo"><img class="btn-icon" src="/brand/albedo.png" alt="">Albedo</button>
          <span class="or" data-i18n="or"></span>
          <button type="button" data-connect="recipient" data-wallet="freighter"><img class="btn-icon" src="/brand/freighter.png" alt="">Freighter</button>
        </span>
      </div>
      <p class="hint"><span data-i18n="step1.toHint"></span> <button type="button" class="link" id="otherRecipient" data-i18n="step1.otherRecipient"></button></p>
      <p class="hint" id="recipientWarning" hidden data-i18n="step1.noMemo"></p>
    </div>
    <div class="field">
      <label for="amount" data-i18n="step1.amount"></label>
      <div class="row">
        <input id="amount" inputmode="decimal" autocomplete="off" class="short">
        <button type="button" id="max" data-i18n="step1.max"></button>
      </div>
      <p class="hint" data-i18n="step1.amountHint"></p>
    </div>
    <div class="row">
      <button type="button" id="check" class="primary" data-i18n="step1.check"></button>
    </div>
    <p class="status" id="status1"></p>
  </section>

  <section class="step fwd" id="step2" data-state="idle">
    <h2><span class="num">2</span> <span data-i18n="step2.title"></span></h2>
    <p data-i18n="step2.text"></p>
    <div class="row">
      <button type="button" id="burn" class="primary" data-i18n="step2.burn"></button>
    </div>
    <p class="status" id="status2"></p>
  </section>

  <section class="step fwd" id="step3" data-state="idle">
    <h2><span class="num">3</span> <span data-i18n="step3.title"></span></h2>
    <div class="field resume">
      <label for="burnTx" data-i18n="step3.burnTx"></label>
      <input id="burnTx" placeholder="0x…" autocomplete="off" spellcheck="false">
      <p class="hint" data-i18n="step3.resume"></p>
    </div>
    <div class="field" id="signerPick">
      <label data-i18n="step3.signer"></label>
      <div class="row">
        <span class="actions">
          <button type="button" data-connect="signer" data-wallet="albedo"><img class="btn-icon" src="/brand/albedo.png" alt="">Albedo</button>
          <span class="or" data-i18n="or"></span>
          <button type="button" data-connect="signer" data-wallet="freighter"><img class="btn-icon" src="/brand/freighter.png" alt="">Freighter</button>
        </span>
      </div>
      <p class="hint" data-i18n="step3.signerHint"></p>
    </div>
    <p class="field" id="signerKnown" hidden>
      <span id="signerText"></span>
      <button type="button" class="link" id="signerChange" data-i18n="step3.changeSigner"></button>
    </p>
    <div class="row">
      <button type="button" id="prepare" class="primary" data-i18n="step3.prepare"></button>
      <button type="button" id="sign" class="primary" hidden></button>
    </div>
    <p class="status" id="status3"></p>
  </section>

  <!-- Stellar → Polygon: steps 4–6 in the code, numbered 1–3 on the page -->
  <section class="step rev" id="step4" data-state="active">
    <h2><span class="num">1</span> <span data-i18n="step1.title"></span></h2>
    <div class="field">
      <label for="rSender" data-i18n="r1.from"></label>
      <div class="row">
        <input id="rSender" readonly placeholder="G…" autocomplete="off" spellcheck="false">
        <span class="actions">
          <button type="button" data-connect="sender" data-wallet="albedo"><img class="btn-icon" src="/brand/albedo.png" alt="">Albedo</button>
          <span class="or" data-i18n="or"></span>
          <button type="button" data-connect="sender" data-wallet="freighter"><img class="btn-icon" src="/brand/freighter.png" alt="">Freighter</button>
        </span>
      </div>
    </div>
    <div class="field">
      <label for="rRecipient" data-i18n="r1.to"></label>
      <div class="row">
        <input id="rRecipient" readonly placeholder="0x…" autocomplete="off" spellcheck="false">
        <span class="actions"><button type="button" id="rConnectEvm"><img class="btn-icon" src="/brand/metamask.svg" alt=""><span data-i18n="step1.connectMetaMask"></span></button></span>
      </div>
      <p class="hint"><span data-i18n="r1.toHint"></span> <button type="button" class="link" id="rOtherRecipient" data-i18n="step1.otherRecipient"></button></p>
      <p class="hint" id="rRecipientWarning" hidden data-i18n="r1.noMemo"></p>
    </div>
    <div class="field">
      <label for="rAmount" data-i18n="step1.amount"></label>
      <div class="row">
        <input id="rAmount" inputmode="decimal" autocomplete="off" class="short">
        <button type="button" id="rMax" data-i18n="step1.max"></button>
      </div>
      <p class="hint" data-i18n="r1.amountHint"></p>
    </div>
    <div class="row">
      <button type="button" id="rCheck" class="primary" data-i18n="step1.check"></button>
    </div>
    <p class="status" id="status4"></p>
  </section>

  <section class="step rev" id="step5" data-state="idle">
    <h2><span class="num">2</span> <span data-i18n="r2.title"></span></h2>
    <p data-i18n="r2.text"></p>
    <div class="row">
      <button type="button" id="rBurn" class="primary" data-i18n="r2.burn"></button>
    </div>
    <p class="status" id="status5"></p>
  </section>

  <section class="step rev" id="step6" data-state="idle">
    <h2><span class="num">3</span> <span data-i18n="r3.title"></span></h2>
    <div class="field resume">
      <label for="rBurnTx" data-i18n="r3.burnTx"></label>
      <input id="rBurnTx" placeholder="5e1c…" autocomplete="off" spellcheck="false">
      <p class="hint" data-i18n="r3.resume"></p>
    </div>
    <div class="row">
      <button type="button" id="rPrepare" class="primary" data-i18n="step3.prepare"></button>
      <button type="button" id="rReceive" class="primary" hidden><img class="btn-icon" src="/brand/metamask.svg" alt=""><span data-i18n="r3.receive"></span></button>
    </div>
    <p class="status" id="status6"></p>
  </section>

  <details class="log">
    <summary data-i18n="log"></summary>
    <pre id="log"></pre>
  </details>

  <footer>
    <section class="contracts-block">
      <h2 data-i18n="contracts.title"></h2>
      <div class="contracts" id="contracts"></div>
      <p class="hint"><span data-i18n="contracts.note"></span> <a href="https://developers.circle.com/cctp/references/stellar" target="_blank" rel="noopener" data-i18n="contracts.circleDocs"></a></p>
    </section>
    <nav class="footer-links">
      <a href="https://github.com/Alex0007/cctp-stellar" target="_blank" rel="noopener" data-i18n="footer.source"></a>
      <a href="https://developers.circle.com/cctp" target="_blank" rel="noopener" data-i18n="footer.cctp"></a>
      <a href="https://eww.monster" target="_blank" rel="noopener">eww.monster</a>
    </nav>
  </footer>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
