<!doctype html><html><head><meta charset="utf-8">
<style>
  html,body{ margin:0; width:1200px; height:630px; overflow:hidden; }
  body{ background:#f4f6f9; color:#141a22; font-family:-apple-system, "Inter", "Segoe UI", system-ui, sans-serif; position:relative; }
  .grid{ position:absolute; inset:0; background-image:linear-gradient(#dfe4ea 1px, transparent 1px), linear-gradient(90deg, #dfe4ea 1px, transparent 1px); background-size:60px 60px; opacity:.55; }
  .wrap{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:44px; }
  .route{ display:flex; align-items:center; gap:36px; }
  .sep{ width:3px; height:110px; background:#c9d1db; border-radius:2px; }
  .arrow{ width:80px; height:40px; }
  .title{ font-size:60px; font-weight:700; letter-spacing:-.02em; margin:0; }
  .sub{ font-size:26px; color:#5f6b7a; margin:0; }
  .domain{ position:absolute; right:56px; bottom:44px; font-size:24px; color:#5f6b7a; font-family:ui-monospace, Menlo, monospace; }
  .cctp{ position:absolute; left:56px; bottom:44px; font-size:22px; color:#5f6b7a; }
</style></head><body>
<div class="grid"></div>
<div class="wrap">
  <div class="route">
    <img src="../public/brand/usdc.svg" width="150" height="150">
    <div class="sep"></div>
    <img src="../public/brand/polygon.svg" width="134" height="120">
    <svg class="arrow" viewBox="0 0 40 20" fill="none" stroke="#141a22" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h32M27 3l8 7-8 7"/></svg>
    <img src="../public/brand/stellar.svg" width="150" height="130">
  </div>
  <h1 class="title">USDC from Polygon to Stellar</h1>
  <p class="sub">Burn on Polygon, mint on Stellar 1:1. No added fees.</p>
</div>
<div class="cctp">Circle CCTP V2</div>
<div class="domain">usdc.eww.monster</div>
</body></html>
